name: COMPAKT zu Hetzner deployen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compakt-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website bauen und prüfen
        run: |
          python -m pip install -r requirements.txt
          python build.py
          python verify.py
          node --check dist/app.js
      - name: SFTP installieren
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Website hochladen
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_TARGET_DIR: ${{ secrets.HETZNER_TARGET_DIR }}
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, tempfile, re, hashlib
          from pathlib import Path
          required=['HETZNER_HOST','HETZNER_USER','SSHPASS']
          missing=[key for key in required if not os.environ.get(key,'').strip()]
          if missing:
              raise SystemExit('Fehlende GitHub-Secrets: '+', '.join('HETZNER_PASSWORD' if k=='SSHPASS' else k for k in missing))
          def quote(value):
              if '\n' in value or '\r' in value:
                  raise ValueError('Invalid SFTP path')
              return '"'+value.replace('\\','\\\\').replace('"','\\"')+'"'
          def sftp(commands):
              with tempfile.NamedTemporaryFile(mode='w',suffix='.sftp') as f:
                  f.write('\n'.join(commands+['bye'])+'\n'); f.flush()
                  return subprocess.run(['sshpass','-e','sftp','-oBatchMode=no','-oStrictHostKeyChecking=accept-new','-oConnectTimeout=20','-P',os.environ.get('HETZNER_PORT') or '22','-b',f.name,os.environ['HETZNER_USER']+'@'+os.environ['HETZNER_HOST']],capture_output=True,text=True)
          configured=os.environ.get('HETZNER_TARGET_DIR','').strip()
          candidates=[configured] if configured else ['compakt','public_html/compakt','/public_html/compakt']
          resolved={}
          for candidate in candidates:
              if candidate in ('/', '.', '..'):
                  raise SystemExit('Bitte ein eindeutiges Website-Zielverzeichnis konfigurieren.')
              result=sftp(['cd '+quote(candidate),'pwd'])
              if result.returncode==0:
                  match=re.search(r'Remote working directory: (.+)',result.stdout)
                  if match: resolved[match.group(1).strip()]=candidate
          if len(resolved)!=1:
              raise SystemExit('Compakt-Zielordner nicht eindeutig erreichbar. Gefundene passende Verzeichnisse: '+str(len(resolved)))
          target=next(iter(resolved))
          print('Compakt-Zielordner auf dem Server eindeutig gefunden.')
          root=Path('dist')
          commands=['cd '+quote(target)]
          commands += ['-mkdir '+quote(str(p.relative_to(root))) for p in sorted(root.rglob('*')) if p.is_dir()]
          files=sorted(p for p in root.rglob('*') if p.is_file())
          files.sort(key=lambda p:(p.suffix=='.html',str(p)))
          commands += ['put '+quote(str(p))+' '+quote(str(p.relative_to(root))) for p in files]
          with tempfile.TemporaryDirectory() as tmp:
              check=Path(tmp)/'index.html'
              commands += ['get index.html '+quote(str(check))]
              result=sftp(commands)
              if result.returncode:
                  print(result.stderr[-3000:])
                  raise SystemExit('SFTP-Upload fehlgeschlagen.')
              if hashlib.sha256(check.read_bytes()).digest()!=hashlib.sha256((root/'index.html').read_bytes()).digest():
                  raise SystemExit('Prüfung der hochgeladenen Startseite fehlgeschlagen.')
          print(str(len(files))+' Dateien zu Hetzner übertragen; Startseite vom Server zurückgelesen und verifiziert.')
          PY
