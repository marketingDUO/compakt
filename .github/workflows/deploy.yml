name: COMPAKT zu Hetzner deployen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compakt-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website bauen und prüfen
        run: |
          python -m pip install -r requirements.txt
          python build.py
          python verify.py
          node --check dist/app.js
      - name: SFTP installieren
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Website hochladen
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_TARGET_DIR: ${{ secrets.HETZNER_TARGET_DIR }}
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          required=['HETZNER_HOST','HETZNER_USER','HETZNER_TARGET_DIR','SSHPASS']
          missing=[key for key in required if not os.environ.get(key,'').strip()]
          if missing:
              raise SystemExit('Fehlende GitHub-Secrets: '+', '.join('HETZNER_PASSWORD' if k=='SSHPASS' else k for k in missing))
          if os.environ['HETZNER_TARGET_DIR'].strip() in ('/', '.', '..'):
              raise SystemExit('Bitte ein eindeutiges Website-Zielverzeichnis konfigurieren.')
          PY
          SFTP_BATCH="$(mktemp)"
          export SFTP_BATCH
          trap 'rm -f "$SFTP_BATCH"' EXIT
          python - <<'PY'
          import os
          from pathlib import Path
          def quote(value):
              if '\n' in value or '\r' in value:
                  raise ValueError('Invalid SFTP path')
              return '"'+value.replace('\\','\\\\').replace('"','\\"')+'"'
          root=Path('dist')
          commands=['cd '+quote(os.environ['HETZNER_TARGET_DIR'])]
          commands += ['-mkdir '+quote(str(p.relative_to(root))) for p in sorted(root.rglob('*')) if p.is_dir()]
          files=sorted(p for p in root.rglob('*') if p.is_file())
          # Transfer assets before HTML so new pages find their media.
          files.sort(key=lambda p:(p.suffix=='.html',str(p)))
          commands += ['put '+quote(str(p))+' '+quote(str(p.relative_to(root))) for p in files]
          Path(os.environ['SFTP_BATCH']).write_text('\n'.join(commands+['bye'])+'\n')
          PY
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new -oConnectTimeout=20 -P "${HETZNER_PORT:-22}" -b "$SFTP_BATCH" "$HETZNER_USER@$HETZNER_HOST"
